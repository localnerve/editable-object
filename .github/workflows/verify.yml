name: Verify
on:
  pull_request:
    branches: [ main, rc-stage ]

jobs:
  verify:

    runs-on: ubuntu-24.04

    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # 7.1.0
      with:
        node-version: ${{ matrix.node-version }}
    - name: Setup Google Chrome # WATCH: match with axe-cli prerequisites
      uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # 2.2.0
      id: setup-chrome
      with:
        chrome-version: '149' # WATCH: match with axe-cli prerequisite version
        install-dependencies: true
        install-chromedriver: true
    - name: Export Chrome Binary Paths
      run: |
        echo "CHROME_BIN=${{ steps.setup-chrome.outputs.chrome-path }}" >> $GITHUB_ENV
        echo "CHROMEDRIVER_BIN=${{ steps.setup-chrome.outputs.chromedriver-path }}" >> $GITHUB_ENV
    - run: npm ci
    - run: npx playwright install
    - name: Run Lint and Test
      run: |
        npm run lint
        npm run test:ci
        npm run test:playwright